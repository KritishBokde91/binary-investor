name: CI

on:
  push:
    branches: [ master, main, 'phase-*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint, Typecheck, Security & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sheep_or_sleep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit pytest-asyncio fakeredis greenlet aiosqlite

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy --ignore-missing-imports src/

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sheep_or_sleep
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: binary-investor/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: binary-investor
        run: npm ci

      - name: Run ESLint
        working-directory: binary-investor
        run: npm run lint

      - name: Run TypeScript Compiler Check
        working-directory: binary-investor
        run: npx tsc --noEmit

      - name: Build Next.js Web App
        working-directory: binary-investor
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Run Node Contract Tests
        run: node --test tests/*.test.mjs

  security:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
